schema_version = "1.4"

[task]
name = "viem/tokens-predefined-usdc"
version = "1.0.0"
description = "Resolve predefined mainnet USDC and read its on-chain metadata and total supply."

[metadata]
area = "tokens"
contract = "example"
tier = "anvil-fork"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
