name: Complete YNX chain export

on:
  push:
    branches:
      - add-ynx-testnet-6423

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-ynx-testnet-6423
      - name: Add YNX export
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/chains/index.ts')
          s = p.read_text()
          line = "export { ynxTestnet } from './definitions/ynxTestnet.js'"
          if line not in s:
              anchor = "export { yooldoVerseTestnet } from './definitions/yooldoVerseTestnet.js'"
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s = s.replace(anchor, anchor + '\n' + line, 1)
              p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/ynx-patch.yml
          git config user.name "JiahaoAlbus"
          git config user.email "159010359+JiahaoAlbus@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(chains): export YNX Testnet"
          git push origin HEAD:add-ynx-testnet-6423
