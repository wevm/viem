name: Diagnose Zone
on:
  push:
    branches: [jxom/fix-main-ci-zone]
  workflow_dispatch:
jobs:
  zone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/install-dependencies
      - run: pnpm contracts:build
      - run: pnpm test --run --project tempo src/tempo/actions/zone.test.ts --retry=0
        env:
          VITE_TEMPO_ENV: localnet
          VITE_TEMPO_HARDFORK: T13
          VITE_TEMPO_TAG: latest
          VITE_TEMPO_ZONES: 'true'
          VITE_TEMPO_LOG: 'true'
          VITE_TEMPO_ZONE_TAG: sha256:ad97eaf7025f87f630b4be14f46b0f7b917710b11121b2f73988caaf9d260e81
