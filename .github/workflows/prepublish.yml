name: Prepublish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('branch-{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || format('{0}-{1}-{2}', github.ref_type, github.repository, github.ref_name) }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10


      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Prepare prerelease
        run: |
          pnpm version prerelease --preid $(git rev-parse --short=7 HEAD) --no-git-tag-version
          pnpm changeset:prepublish

      - name: Publish prerelease
        if: github.repository == 'wevm/viem'
        run: pnpx pkg-pr-new publish --pnpm --compact '.'
