name: Pull request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-branch-${{ github.event.pull_request.head.repo.full_name }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      full: ${{ !github.event.pull_request.draft }}
    secrets: inherit
    permissions:
      contents: read

  size:
    name: Size
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: 
          submodules: 'recursive'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Report bundle size
        uses: wevm/actions/vendor/andresz1/size-limit-action/v1.8.0@73e899a58d51092d694fbaf94b7a1d8c09bfea28
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
