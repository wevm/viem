name: Pull request
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-branch-${{ github.event.pull_request.head.repo.full_name }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    with:
      full: ${{ !github.event.pull_request.draft }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  size:
    name: Size
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6


      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Report bundle size
        uses: wevm/actions/vendor/andresz1/size-limit-action/v1.8.0@8963daf30237417f873c8e2f17e3bf9415e3a7b9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: pnpm
