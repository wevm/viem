name: Changesets
on:
  push:
    branches: [main, v3]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {} # each job should declare only the permissions it needs

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets: inherit
    permissions:
      contents: read # checkout repository contents in the reusable workflow
      id-token: write # upload coverage through Codecov OIDC

  changesets:
    name: Create version pull request
    # Versioning and releases run from the wevm/viem repository only.
    if: github.repository == 'wevm/viem'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    permissions:
      contents: write # commit version/changelog updates to the release pull request
      pull-requests: write # create or update the Changesets release pull request

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          skip-cache: true # avoid cache poisoning attacks

      - name: Create Version Pull Request
        id: changesets
        uses: wevm/actions/vendor/changesets/action/v1@9bf103bd47b43c77baa02648201039b6ef3d713b # upstream v1.9.0
        with:
          commit: 'chore: version package'
          title: 'chore: version package'
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prerelease:
    name: Publish prerelease
    # Keep v3 prereleases independent from the stable release verification gate.
    if: github.ref == 'refs/heads/v3' && needs.changesets.outputs.hasChangesets == 'false'
    needs: changesets
    runs-on: ubuntu-latest
    # TODO: Add `environment: npm` after configuring the npm environment with required reviewers.
    timeout-minutes: 5
    permissions:
      contents: write # create GitHub releases and tags after npm publish
      id-token: write # authenticate to npm via trusted publishing

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          skip-cache: true # avoid cache poisoning attacks

      - name: Publish to NPM
        uses: wevm/actions/vendor/changesets/action/v1@9bf103bd47b43c77baa02648201039b6ef3d713b # upstream v1.9.0
        with:
          createGithubReleases: false
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    if: github.ref == 'refs/heads/main' && needs.changesets.outputs.hasChangesets == 'false'
    needs: [verify, changesets]
    runs-on: ubuntu-latest
    # TODO: Add `environment: npm` after configuring the npm environment with required reviewers.
    timeout-minutes: 5
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write # create GitHub releases and tags after npm publish
      id-token: write # authenticate to npm via trusted publishing

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          skip-cache: true # avoid cache poisoning attacks

      - name: Publish to NPM
        id: changesets
        uses: wevm/actions/vendor/changesets/action/v1@9bf103bd47b43c77baa02648201039b6ef3d713b # upstream v1.9.0
        with:
          createGithubReleases: true
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
