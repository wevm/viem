name: "Install dependencies"
description: "Prepare repository and all dependencies"

inputs:
  skip-cache:
    description: 'Skip dependency cache restore/save'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: v1.7.1

    - name: Set up pnpm
      uses: wevm/actions/.github/actions/pnpm-v4@fb23e449c43e848371a2090a5e3fd49f7f569b87
      with:
        node-version: 24.22.1
        skip-cache: ${{ inputs.skip-cache }}
