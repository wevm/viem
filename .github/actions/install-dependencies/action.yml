name: "Install dependencies"
description: "Prepare repository and all dependencies"

inputs:
  skip-cache:
    description: 'Skip dependency cache restore/save'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Set up foundry
      uses: wevm/actions/vendor/foundry-rs/foundry-toolchain/v1.9.2@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac
      with:
        version: v1.8.7

    - name: Set up pnpm
      uses: wevm/actions/.github/actions/pnpm@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac
      with:
        node-version: 24.22.1
        skip-cache: ${{ inputs.skip-cache }}
