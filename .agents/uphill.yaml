# viem's metrics. Each script fans out over every public export of the 26 entry points in
# src/package.json, and over every public function, so each export and function scores on its own.
# The scripts measure the build that `pnpm build` writes to src/_esm and src/_types.

# Install scripts stay off; the speed script records viem's tests, which need the contracts that
# viem's postinstall builds with Foundry, so setup builds them last. The scripts keep their own
# dependencies, such as rolldown, in .agents/metrics.
setup: 'pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild bun && pnpm build && bun install --cwd .agents/metrics && git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive && pnpm contracts:build'

footprint:
  run: bun .agents/metrics/footprint.ts
  description: 'Gzipped bytes a browser bundle adds to import each export from its entry point, or a whole entry point.'
  # Gzipped bytes a consumer bundles to import one export from its entry point, such as
  # `viem/actions:getBlockNumber`, or the whole entry, such as `viem/actions`. rolldown bundles and
  # minifies each import for the browser. Chunks that load only through a dynamic import are left
  # out. Targets sit where a known change puts each kind, such as chains as plain data and helpers
  # without the secp256k1 curve, or at its p90 where no change is known. The first matching
  # pattern applies.
  entry-size:
    target: 20kB
    targets:
      viem: 125kB
      viem/tempo: 285kB
      # A Tempo chain as plain data brings the entry to 70 kB.
      viem/chains: 75kB
      viem/tempo/actions: 160kB
      viem/tempo/chains: 125kB
      viem/accounts: 120kB
      viem/zksync: 115kB
      viem/actions: 100kB
      viem/experimental: 85kB
      viem/account-abstraction: 80kB
      viem/utils: 80kB
      viem/op-stack: 70kB
      viem/ens: 65kB
      viem/siwe: 60kB
      viem/experimental/erc7739: 50kB
      viem/experimental/erc7821: 55kB
      # Functions that map errors, not error classes.
      "*:get*Error": 20kB
      # These decode the revert data they carry.
      "*:ContractFunction*Error": 10kB
      "viem/tempo:ExecutionError": 16kB
      # Error classes, whose p90 is 969 B.
      "*Error": 1kB
      # A Tempo chain bundles 110 kB today because its formatters, serializer and hooks carry
      # ox/tempo, secp256k1 and several actions. As plain data it is 540 B.
      "viem/chains:tempo*": 2kB
      "viem/tempo*": 160kB
      # Decorators bundle every action on purpose.
      "*Actions*": 100kB
      "*:create*Client": 100kB
      # Plain chains are about 0.4 kB. OP Stack chains reach 3 kB without the deposit-only
      # serializer, and 2 kB when chain formatters extend the base ones. Celo and zkSync chains
      # bundle their own formatters and serializers.
      "viem/chains:*": 4kB
      "viem/tokens:*": 4kB
      # Verification bundles `call`, the ERC-6492 validator bytecode and secp256k1.
      "*:verify*": 30kB
      "viem/zksync:*": 45kB
      "viem/op-stack:*": 40kB
      "viem/siwe:*": 55kB
      "viem/experimental*": 50kB
      "viem/ens:*": 35kB
      "viem/actions:*": 25kB
      "viem/accounts:*": 35kB
      "viem/account-abstraction:*": 35kB
      "viem/utils:*": 10kB
      "viem:*": 10kB
