speed:
  run: bun .agents/metrics/speed.ts
  description: 'CPU time and memory per call of each public function, replaying the arguments viem''s tests pass it, and the time and memory to import each entry point.'
  # Recording viem's tests takes about 35 minutes and replaying them about 11 at concurrency 2.
  timeout: 90m
  # CPU time per call of each public function, replaying the arguments viem's tests call it with.
  # viem's and ox's LRU caches are emptied before every call, so each call does a first call's
  # work while caching still works inside it, and the note gives the time with them warm. Actions
  # replay against the JSON-RPC exchanges their test got. Most calls take under 30 µs, so the default is 100 µs. Cryptography
  # whose cost is inherent has a target about 1.5 times its time today, since CPU time varies
  # between runs. The first matching pattern applies.
  call-time:
    target: 100µs
    targets:
      # BIP-39 derives the seed with 2,048 rounds of PBKDF2-HMAC-SHA512.
      "viem/accounts:mnemonicToAccount": 21ms
      # Blob work scales with its input. The recorded fromBlobs test passes large data.
      "viem:fromBlobs": 25ms
      "viem:toBlobs": 500µs
      # secp256k1 public key recovery. ERC-8010 serialization recovers the authorization's signer.
      "*:recover*": 4.5ms
      "viem:verify*": 4.5ms
      "viem:serializeErc8010Signature": 3ms
      # secp256k1 and P-256 signing and key derivation. signTypedData also hashes the typed data.
      "viem/accounts:signTypedData": 1.7ms
      "viem/accounts:sign*": 750µs
      "viem/accounts:privateKeyTo*": 500µs
      "viem/tempo:Account.from*": 650µs
      "viem/tempo:WebCryptoP256.*": 300µs
      # Actions do client-side work around the replayed requests: polling receipts, extracting
      # events, and formatting.
      "viem/actions:waitForTransactionReceipt": 15ms
      "viem/tempo:Actions.zone.waitForTempoBlock": 13ms
      "viem/tempo:AccountOperation.*": 15ms
      "viem/tempo:Actions.*Sync": 3ms
      "viem/tempo:Actions.*.inner": 3ms
      "viem/tempo:Actions.*": 1.5ms
      "viem/actions:*": 1.2ms
      "viem/op-stack:*": 700µs
  # Heap bytes each call allocates. Most calls allocate under 11 kB, so the default is 50 kB. The
  # same cryptography has a target about 1.25 times its allocation today, which barely varies.
  call-memory:
    varies: true
    target: 50kB
    targets:
      "viem/accounts:mnemonicToAccount": 18MB
      "viem:fromBlobs": 5MB
      "viem:toBlobs": 1.3MB
      "*:recover*": 1.5MB
      "viem:verify*": 1.4MB
      "viem:serializeErc8010Signature": 1.3MB
      "viem/accounts:signTypedData": 600kB
      "viem/accounts:sign*": 380kB
      "viem/accounts:privateKeyTo*": 220kB
      "viem/tempo:Account.from*": 250kB
      "viem/tempo:AccountOperation.*": 5.5MB
      "viem/tempo:Actions.*": 1MB
      "viem/actions:*": 160kB
      "viem/op-stack:*": 300kB
  # CPU time to import each entry point in a fresh Node process.
  import-time: {}
  # Heap bytes each entry point holds once imported.
  import-memory:
    baseline:
      viem: 6690kB
