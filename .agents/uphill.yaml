# Type-checking cost at the call sites viem's tests write: one call per public function, the first
# its own runtime tests make (else its type tests, else any test). Each call is copied into
# `const $uphill = <call>` before its statement and checked in a fresh checker once its imports,
# fixtures (an ABI, a client, inline calls such as parseAbi([...])) and the callee's declared
# signature are resolved. Relating those to the function's parameters counts: that is checking the
# call. Instantiations are exact, so one run suffices.
call-types:
  run: bun .agents/metrics/types-calls.ts
  description: 'Type instantiations for TypeScript to check the call each public function''s tests make.'
  timeout: 20m
  # What a call should cost: 1,000 for a utility; 5,000 for an ABI or typed-data utility and for an
  # action, where about 4,500 is relating the anvil test client to `Client<...>`; 10,000 where the
  # call also infers from an ABI, typed data, or a list of calls. The first match applies.
  instantiations:
    target: 1000
    targets:
      # Infer over every chain the test passes.
      "viem:extractChain": 25000
      "viem/utils:filterChains": 25000
      # Passing a chain should be cheap: relating `mainnet` to `Chain` cost 52,000 before
      # `ChainFees` and `ChainSerializers` declared their variance, and about 8,000 after.
      "viem:getChainContractAddress": 1000
      "viem:assertCurrentChain": 1000
      "*:*Contract*": 10000
      "*:multicall": 10000
      "*:*Calls*": 10000
      "*:*TypedData*": 10000
      "*:*UserOperation*": 10000
      "*:create*Client*": 10000
      "viem:*Abi*": 5000
      "viem:*Function*": 5000
      "viem:*Event*": 5000
      "viem:*Error*": 5000
      "viem:*DeployData": 5000
      "viem:encodePacked": 5000
      "viem:hash*": 5000
      "viem/actions:*": 5000
      "viem/tempo:Actions.*": 5000
      "viem/tempo:Account.*": 5000
      "viem/op-stack:*": 5000
      "viem/zksync:*": 5000
      "viem/linea:*": 5000
      "viem/celo:*": 5000
      "viem/ens:*": 5000
      "viem/account-abstraction:*": 5000
      "viem/experimental*:*": 5000

# Whether each public function has a call in viem's tests that call-types measures; the note says
# why not. It shares the call-types script's run.
type-coverage:
  run: bun .agents/metrics/types-calls.ts
  description: 'Whether each public function has a test call that Call types can measure.'
  timeout: 20m
  type-benched: {}

fuzz:
  run: bun .agents/metrics/fuzz.ts
  description: 'Whether each public function has a fuzz harness, whether fuzzing finds no failure, and how much of its source the fuzzer runs.'
  # About 3 minutes at UPHILL_CONCURRENCY=2; the limit leaves room for a loaded machine.
  timeout: 15m
  # Whether each public function has a fuzz harness that ran: structured properties (round trips,
  # differentials against ox and ethers, consistency) or boundary mutations of the arguments viem's
  # tests pass it. The note lists the harnesses, or says why there is none, such as a client.
  fuzzed: {}
  # Whether fuzzing found no failure: no undocumented TypeError, RangeError, or SyntaxError on an
  # input that keeps the declared types, no stack overflow, hang, or runaway memory, and no broken
  # round trip, differential, or consistency property. The note gives the minimized input.
  fuzz-clean: {}
  # Percent of the function's own source lines that ran under fuzzing (V8 precise coverage of
  # src/_esm).
  fuzz-coverage: { target: 80, better: higher }
