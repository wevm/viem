  run: bun .agents/metrics/types.ts
  description: 'Type instantiations, check time, and memory for TypeScript to check one use of each public export.'
  timeout: 15m
  # Type instantiations to check one use of each public export, values and types, with namespace
  # members counted as exports. A use is `typeof` the value, with `Parameters` and `ReturnType` for
  # a function, or the type at its defaults, plus one level of properties. Each export is checked
  # in its own program, minus a program that only imports its entry. Actions that take a `Client`
